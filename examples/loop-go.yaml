# Go completion loop. Copy to .agents/loop.yaml or use: neo-runner init --preset go
# neo-runner run -f .agents/loop.yaml --output json
# Edit this file to match the project's Definition of Done.
version: 1
job:
  name: agent-loop
  fail_fast: true
  max_concurrency: 1
  default_timeout: 120s
  tasks:
    - id: test
      type: shell
      cmd: "go test ./..."

    # - id: fmt
    #   type: shell
    #   cmd: "gofmt -l ."
