[workspace]
resolver = "2"
members = [
  "crates/runner-cli",
  "crates/runner-core",
  "crates/runner-app",
  "crates/runner-infra",
  "crates/runner-plugins",
  "crates/xtask",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/your-org/neo-runner"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
tracing = "0.1"
