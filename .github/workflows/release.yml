name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for manual publish)"
        required: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.meta.outputs.should_release }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          should_release="false"

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -n "${INPUT_TAG}" ]; then
              tag="${INPUT_TAG}"
              should_release="true"
            else
              echo "manual dispatch requires tag input" >&2
              exit 1
            fi
          elif [ "${REF_TYPE}" = "tag" ]; then
            tag="${REF_NAME}"
            should_release="true"
          else
            range="${BEFORE_SHA}..${AFTER_SHA}"
            if git log --format=%s "${range}" | grep -E '^(feat|fix):' >/dev/null; then
              tag="auto-$(date -u +%Y%m%d%H%M%S)-${AFTER_SHA:0:7}"
              should_release="true"
            else
              tag=""
            fi
          fi

          if [ "${should_release}" = "true" ]; then
            echo "release_name=neo-runner ${tag}" >> "$GITHUB_OUTPUT"
          else
            echo "release_name=" >> "$GITHUB_OUTPUT"
          fi

          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${tag}" >> "$GITHUB_OUTPUT"

  build-linux:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools upx-ucl || sudo apt-get install -y musl-tools upx

      - name: Add Linux musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build Debian package
        env:
          NEO_RUNNER_TARGET: x86_64-unknown-linux-musl
        run: cargo run -p xtask -- release

      - name: Build Linux binary archive
        run: |
          cp dist/neo-runner_*_amd64/usr/bin/neo-runner dist/neo-runner-linux-x86_64
          chmod +x dist/neo-runner-linux-x86_64
          tar -czf dist/neo-runner-linux-x86_64.tar.gz -C dist neo-runner-linux-x86_64
          sha256sum dist/neo-runner-linux-x86_64 > dist/neo-runner-linux-x86_64.sha256
          sha256sum dist/neo-runner-linux-x86_64.tar.gz > dist/neo-runner-linux-x86_64.tar.gz.sha256

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neo-runner-linux
          path: |
            dist/neo-runner_*_amd64.deb
            dist/neo-runner_*_amd64.deb.sha256
            dist/neo-runner-linux-x86_64
            dist/neo-runner-linux-x86_64.sha256
            dist/neo-runner-linux-x86_64.tar.gz
            dist/neo-runner-linux-x86_64.tar.gz.sha256

  build-windows:
    runs-on: windows-latest
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install UPX
        shell: pwsh
        run: choco install upx -y

      - name: Build Windows executable
        run: cargo build -p runner-cli --release

      - name: Compress Windows executable with UPX
        shell: pwsh
        run: upx -9 target/release/neo-runner.exe

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/neo-runner.exe dist/neo-runner.exe
          Compress-Archive -Path dist/neo-runner.exe -DestinationPath dist/neo-runner-windows-x86_64.zip -Force
          $exeHash = (Get-FileHash dist/neo-runner.exe -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash dist/neo-runner-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/neo-runner.exe.sha256 -Value "$exeHash  neo-runner.exe"
          Set-Content -Path dist/neo-runner-windows-x86_64.zip.sha256 -Value "$zipHash  neo-runner-windows-x86_64.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neo-runner-windows
          path: |
            dist/neo-runner.exe
            dist/neo-runner.exe.sha256
            dist/neo-runner-windows-x86_64.zip
            dist/neo-runner-windows-x86_64.zip.sha256

  publish:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-linux
      - build-windows
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: neo-runner-linux
          path: dist

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: neo-runner-windows
          path: dist

      - name: Build release notes from commits
        id: notes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            range="HEAD~20..HEAD"
          else
            range="${BEFORE_SHA}..${AFTER_SHA}"
          fi

          feat_lines="$(git log --format='- %s (%h)' "${range}" | grep -E '^- feat:' || true)"
          fix_lines="$(git log --format='- %s (%h)' "${range}" | grep -E '^- fix:' || true)"
          other_lines="$(git log --format='- %s (%h)' "${range}" | grep -Ev '^- (feat|fix):' || true)"

          {
            echo "body<<EOF"
            echo "## Highlights"
            echo
            echo "### Features"
            if [ -n "${feat_lines}" ]; then
              echo "${feat_lines}"
            else
              echo "- none"
            fi
            echo
            echo "### Fixes"
            if [ -n "${fix_lines}" ]; then
              echo "${fix_lines}"
            else
              echo "- none"
            fi
            echo
            echo "### Other Changes"
            if [ -n "${other_lines}" ]; then
              echo "${other_lines}"
            else
              echo "- none"
            fi
            echo
            echo "### Artifacts"
            echo "- Linux: .deb + raw binary + tar.gz (+ sha256)"
            echo "- Windows: .exe + zip (+ sha256)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Debug token source
        shell: bash
        run: |
          if [ -n "${{ secrets.RELEASE_PAT }}" ]; then
            echo "Using RELEASE_PAT"
          else
            echo "RELEASE_PAT missing -> fallback to github.token"
          fi
          echo "actor=${{ github.actor }}"
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "ref_type=${{ github.ref_type }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT || github.token }}
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.release_name }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
          prerelease: ${{ github.ref_type != 'tag' }}
          files: |
            dist/neo-runner_*_amd64.deb
            dist/neo-runner_*_amd64.deb.sha256
            dist/neo-runner-linux-x86_64
            dist/neo-runner-linux-x86_64.sha256
            dist/neo-runner-linux-x86_64.tar.gz
            dist/neo-runner-linux-x86_64.tar.gz.sha256
            dist/neo-runner.exe
            dist/neo-runner.exe.sha256
            dist/neo-runner-windows-x86_64.zip
            dist/neo-runner-windows-x86_64.zip.sha256
