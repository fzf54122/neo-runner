  <rect x="0" y="0" width="1200" height="280" fill="url(#bg)" rx="20"/>
  <circle cx="170" cy="140" r="72" fill="none" stroke="url(#accent)" stroke-width="10"/>
  <path d="M135 140h70M170 105v70" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
  <text x="280" y="120" fill="#e6f4ff" font-size="56" font-family="Segoe UI, Arial, sans-serif" font-weight="700">neo-runner</text>
